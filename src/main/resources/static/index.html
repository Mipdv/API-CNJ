<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Processual · CNJ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    footer {
      text-align: center;
      padding: 24px;
    }
    footer p {
      margin: 0 0 6px;
      font-family: 'Source Serif 4', serif;
      font-style: italic;
      font-size: 13px;
      color: var(--slate);
    }
    footer a {
      display: inline-flex;
      opacity: 0.55;
      transition: opacity 0.15s ease;
    }
    footer a:hover {
      opacity: 1;
    }
    footer img {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>

<div class="wrap">

  <header class="site">
    <div class="mark">Consulta<span>Processual</span></div>
    <div class="tag">Base CNJ - Datajud</div>
  </header>

  <section class="search-panel">
    <label for="numero">Número do processo (20 dígitos)</label>
    <div class="search-row">
      <input id="numero" type="text" placeholder="0019248-52.2026.4.05.8200" maxlength="25" autocomplete="off">
      <button class="primary" id="btnConsultar">Consultar</button>
    </div>
    <div class="hint">Formato oficial: NNNNNNN-DD.AAAA.J.TR.OOOO</div>
  </section>

  <div id="loading" class="state-box" style="display:none;">Consultando processo…</div>
  <div id="erro" class="state-box error" style="display:none;"></div>

  <div id="resultado">
    <div class="capa" id="capaVisivel"></div>
    <div class="acoes">
      <button class="secondary" id="btnPdf">Baixar PDF</button>
    </div>
  </div>

  <div id="pdf-source"></div>

</div>

<footer>
  <p style="bolder">Desenvolvido por Mipdv</p>
  <a href="https://github.com/Mipdv" target="_blank" rel="noopener" aria-label="GitHub">
    <img src="img/icone-github.png" alt="Github">
  </a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
